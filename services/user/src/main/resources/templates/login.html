<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org">
<head>
	<title>Sign in</title>
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous">
	<link th:href="@{/css/auth.css}" rel="stylesheet" type="text/css">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
	<main class="form-signin w-100 m-auto">
		<div class="alert alert-danger" role="alert" th:if="${param.error}">
		  Invalid username and password.
		</div>
		<div th:if="${param.logout}">You have been logged out.</div>
		<form th:action="@{/auth/login}" method="post">
			<h1 class="h3 mb-3 fw-normal">Sign in</h1>

			<div class="form-floating mb-3">
				<input type="text" class="form-control" id="username" name="username"
					placeholder="Username"> <label for="username">Username</label>
			</div>
			<div class="form-floating mb-3">
				<input type="password" class="form-control" id="password" name="password"
					placeholder="Password"> <label for="password">Password</label>
			</div>

			<button class="btn btn-primary w-100 py-2" type="submit">Sign
				in</button>
		</form>
	</main>
</body>
</html>
