<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="https://www.thymeleaf.org">
<head>
<title>Sign Up</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<link th:href="@{/css/auth.css}" rel="stylesheet" type="text/css">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
	<main class="form-signin w-100 m-auto">
		<div class="alert alert-danger" role="alert" th:if="${param.error}">
			Registration failed. Please try again.</div>
		<form th:action="@{/auth/signup}" method="post"
			th:object="${signUpRequest}">
			<h1 class="h3 mb-3 fw-normal">Sign up</h1>

			<div class="alert alert-danger" role="alert"
				th:if="${#fields.hasGlobalErrors()}">
				<ul>
					<li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
				</ul>
			</div>

			<div class="form-floating mb-3">
				<input type="email" class="form-control" id="email"
					th:field="*{email}" placeholder="name@example.com"
					th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"> <label
					for="email">Email address</label>
				<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
			</div>
			<div class="form-floating mb-3">
				<input type="text" class="form-control" id="username"
					th:field="*{username}" placeholder="username"
					th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"> <label
					for="username">Username</label>
				<div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
			</div>
			<div class="form-floating mb-3">
				<input type="password" class="form-control" id="password"
					th:field="*{password}" placeholder="Password"
					th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"> <label
					for="password">Password</label>
				<div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<div class="form-floating mb-3">
				<input type="password" class="form-control" id="confirmPassword"
					th:field="*{confirmPassword}" placeholder="Password"
					th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"> <label
					for="confirmPassword">Confirm Password</label>
				<div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
			</div>

			<button class="btn btn-primary w-100 py-2" type="submit">Sign
				up</button>
		</form>
	</main>
</body>
</html>
