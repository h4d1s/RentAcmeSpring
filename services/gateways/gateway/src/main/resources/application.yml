spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory
              uri: http://inventory-api:8080
              predicates:
                - Path=/api/*/**

            - id: reservation
              uri: http://reservation-api:8080
              predicates:
                - Path=/api/*/**

            - id: user
              uri: http://user-api:8080
              predicates:
                - Path=/api/*/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never