spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      httpclient:
        connect-timeout: 60000
        response-timeout: 60s
      routes:
        - id: inventory
          uri: http://inventory:5215/
          Predicates:
            - Path=/inventory/**
        - id: reservation
          uri: http://reservation:5225/
          Predicates:
            - Path=/reservation/**
        - id: user
          uri: http://user:5235/
          Predicates:
            - Path=/user/**

server:
  port: 8080