spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory-service
              uri: http://inventory-api:8080
              predicates:
                - Path=/api/{version}/inventories/**
              filters:
                - RewritePath=/api/(?<version>[^/]+)/inventories/?(?<segment>.*), /api/${version}/${segment}

            - id: reservation-service
              uri: http://reservation-api:8080
              predicates:
                - Path=/api/{version}/reservations/**
              filters:
                - RewritePath=/api/(?<version>[^/]+)/reservations/?(?<segment>.*), /api/${version}/${segment}

            - id: account-service
              uri: http://user-api:8080
              predicates:
                - Path=/api/{version}/accounts/**
              filters:
                - RewritePath=/api/(?<version>[^/]+)/accounts/?(?<segment>.*), /api/${version}/${segment}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never