spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory-service
              uri: http://inventory-api:8080
              predicates:
                - Path=/api/v1/inventories/**
              filters:
                - RewritePath=/api/v1/inventories/?(?<segment>.*), /api/v1/${segment}

            - id: reservation-service
              uri: http://reservation-api:8080
              predicates:
                - Path=/api/v1/reservations/**
              filters:
                - RewritePath=/api/v1/reservations/?(?<segment>.*), /api/v1/${segment}

            - id: account-service
              uri: http://user-api:8080
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - RewritePath=/api/v1/accounts/?(?<segment>.*), /api/v1/${segment}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never