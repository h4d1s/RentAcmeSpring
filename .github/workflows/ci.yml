name: CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "master"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify