spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory
              uri: http://inventory-api:8080
              predicates:
                - Path=/api/*/inventories/**

            - id: reservation
              uri: http://reservation-api:8080
              predicates:
                - Path=/api/*/reservations/**

            - id: user
              uri: http://user-api:8080
              predicates:
                - Path=/api/*/accounts/**

server:
  port: 8080