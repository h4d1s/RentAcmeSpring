syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.pixellabs.user.grpc";

service UserProtoService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {}
  rpc GetUserByExternalId(GetUserByExternalIdRequest) returns (GetUserByExternalIdResponse) {}
  rpc UserExists(UserExistsRequest) returns (UserExistsResponse) {}
}

// Get User
message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  string id = 1;
  string externalId = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
}

// Get User By External Id
message GetUserByExternalIdRequest {
  string user_external_id = 1;
}
message GetUserByExternalIdResponse {
  string id = 1;
  string externalId = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
}

// User Exists
message UserExistsRequest {
  string user_id = 1;
}
message UserExistsResponse {
  bool exists = 1;
}