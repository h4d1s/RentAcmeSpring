syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.pixellabs.libs.contracts.grpc";

service InventoryProtoService {
  rpc GetVehicle(GetVehicleRequest) returns (GetVehicleResponse) {}
  rpc CheckVehicle(CheckVehicleRequest) returns (VehicleStatusResponse) {}
}

// GetVehicle
message GetVehicleRequest {
  string vehicle_id = 1;
}
message GetVehicleResponse {
  double rental_price_per_day = 1;
  string registration_plates = 2;
  string variant_id = 3;
}

// CheckVehicle
message CheckVehicleRequest {
  string vehicle_id = 1;
}
message VehicleStatusResponse {
  bool is_exists = 1;
}