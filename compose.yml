services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    env_file: ./.env
    environment:
      RABBITMQ_DEFAULT_USER: $RABBITMQ_USER
      RABBITMQ_DEFAULT_PASS: $RABBITMQ_PASS
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: 
      - rentacme_network

  gateway:
    container_name: gateway
    build:
      context: ./
      dockerfile: ./gateways/gateway/Dockerfile
    ports:
      - "5215:8080"
      - "5216:8000" # Debug
    networks:
      - rentacme_network

  inventory-db:
    container_name: inventory-db
    image: postgres
    env_file: ./.env
    ports:
      - "5220:5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: inventory
    networks: 
      - rentacme_network

  inventory-api:
    container_name: inventory-api
    build:
      context: ./
      dockerfile: ./services/inventory/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
      SPRING_DATASOURCE_USERNAME: $POSTGRES_USER
      SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD
      RABBITMQ_HOST: $RABBITMQ_HOST
      RABBITMQ_PORT: $RABBITMQ_PORT
      RABBITMQ_USER: $RABBITMQ_USER
      RABBITMQ_PASS: $RABBITMQ_PASS
    ports:
      - "5225:8080"
      - "5226:8000" # Debug
    depends_on:
      - inventory-db
    networks: 
      - rentacme_network

  notification-api:
      container_name: notification-api
      build:
        context: ./
        dockerfile: ./services/notification/Dockerfile
      environment:
        RABBITMQ_HOST: $RABBITMQ_HOST
        RABBITMQ_PORT: $RABBITMQ_PORT
        RABBITMQ_USER: $RABBITMQ_USER
        RABBITMQ_PASS: $RABBITMQ_PASS
      ports:
        - "5235:8080"
        - "5236:8000" # Debug
      networks: 
        - rentacme_network

  reservation-db:
    container_name: reservation-db
    image: postgres
    env_file: ./.env
    ports:
      - "5240:5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: reservation
    networks: 
      - rentacme_network

  reservation-api:
    container_name: reservation-api
    build:
      context: ./
      dockerfile: ./services/reservation/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reservation-db:5432/reservation
      SPRING_DATASOURCE_USERNAME: $POSTGRES_USER
      SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD
      RABBITMQ_HOST: $RABBITMQ_HOST
      RABBITMQ_PORT: $RABBITMQ_PORT
      RABBITMQ_USER: $RABBITMQ_USER
      RABBITMQ_PASS: $RABBITMQ_PASS
    ports:
      - "5245:8080"
      - "5246:8000" # Debug
    depends_on:
      - reservation-db
    networks: 
      - rentacme_network

  user-db:
    container_name: user-db
    image: postgres
    env_file: ./.env
    ports:
      - "5250:5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: user
    networks: 
      - rentacme_network

  user-api:
    container_name: user-api
    build:
      context: ./
      dockerfile: ./services/user/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user
      SPRING_DATASOURCE_USERNAME: $POSTGRES_USER
      SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD
      RABBITMQ_HOST: $RABBITMQ_HOST
      RABBITMQ_PORT: $RABBITMQ_PORT
      RABBITMQ_USER: $RABBITMQ_USER
      RABBITMQ_PASS: $RABBITMQ_PASS
    ports:
      - "5255:8080"
      - "5256:8000" # Debug
    depends_on:
      - user-db
    networks: 
      - rentacme_network

  payment-api:
    container_name: payment-api
    build:
      context: ./
      dockerfile: ./services/payment/Dockerfile
    environment:
      RABBITMQ_HOST: $RABBITMQ_HOST
      RABBITMQ_PORT: $RABBITMQ_PORT
      RABBITMQ_USER: $RABBITMQ_USER
      RABBITMQ_PASS: $RABBITMQ_PASS
      STRIPE_API_KEY: $STRIPE_API_KEY
    ports:
      - "5265:8080"
      - "5266:8000" # Debug
    networks: 
      - rentacme_network

  state-machine-db:
    container_name: state-machine-db
    image: postgres
    env_file: ./.env
    ports:
      - "5270:5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: state_machine
    networks: 
      - rentacme_network

  state-machine:
    container_name: state-machine
    build:
      context: ./
      dockerfile: ./state-machines/state-machine/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://state-machine-db:5432/state_machine
      SPRING_DATASOURCE_USERNAME: $POSTGRES_USER
      SPRING_DATASOURCE_PASSWORD: $POSTGRES_PASSWORD
      RABBITMQ_HOST: $RABBITMQ_HOST
      RABBITMQ_PORT: $RABBITMQ_PORT
      RABBITMQ_USER: $RABBITMQ_USER
      RABBITMQ_PASS: $RABBITMQ_PASS
    ports:
      - "5275:8080"
      - "5276:8000" # Debug
    depends_on:
      - state-machine-db
    networks: 
      - rentacme_network

networks:
  rentacme_network: